<svg xmlns="http://www.w3.org/2000/svg" width="360" height="460" viewBox="0 0 360 460">
  <!-- Amazon sword rosette: 11 arching, lance-shaped leaves on short stems,
       fanning from one crown around (180,440). Each leaf + stem is a top-level
       group that sways around its own stem base (data-pivot).
       Leaves use two templates (long and broad) drawn in leaf space: stem
       base at 0,0, pointing up and arching to the right. Left-side leaves
       are mirrored. Strokes are divided by each leaf's scale so outlines
       stay 3 px on screen. Shadow half = the template's right (inner,
       lower) half; rim highlight = the template's left (outer, upper) edge. -->
  <defs>
    <!-- Template 1: long lanceolate leaf -->
    <path id="t1-stem" d="M0,4 C0,-22 -0.5,-48 0.4,-74"/>
    <path id="t1-blade" d="M0,-70 C-12.86,-85.32 -23.62,-145.74 -17.54,-180.21 C-10.6,-219.6 9.42,-265.42 22.53,-297.87 C33.77,-325.69 74.23,-364.36 94,-374 C86.48,-353.33 73.46,-311.8 61.47,-282.13 C48.36,-249.68 48.48,-209.18 41.54,-169.79 C35.46,-135.32 14.14,-84.14 0,-70 Z"/>
    <path id="t1-shade" d="M0,-70 C1.83,-104.95 5.92,-140.53 12,-175 C18.94,-214.39 27.02,-252.91 42,-290 C53.24,-317.82 73.93,-351.71 94,-374 C86.48,-353.33 73.46,-311.8 61.47,-282.13 C48.36,-249.68 48.48,-209.18 41.54,-169.79 C35.46,-135.32 14.14,-84.14 0,-70 Z"/>
    <path id="t1-rim" d="M0,-70 C-12.86,-85.32 -23.62,-145.74 -17.54,-180.21 C-10.6,-219.6 9.42,-265.42 22.53,-297.87 C33.77,-325.69 74.23,-364.36 94,-374"/>
    <path id="t1-mid" d="M0,-72 C1.83,-104.95 5.92,-140.53 12,-175 C18.94,-214.39 27.02,-252.91 42,-290 C53.24,-317.82 73.93,-351.71 90,-369"/>
    <path id="t1-veins" d="M0.5,-78 C-3,-110 -5,-150 -2.77,-177.6 C0,-216 18,-262 32.26,-293.94 C44,-320 66,-350 86,-366 M2,-76 C12,-104 22,-140 26.77,-172.4 C32,-210 42,-256 51.74,-286.06 C60,-312 74,-344 88,-364 M-1,-80 C-9,-104 -14,-145 -12.22,-179.27 C-10,-218 10,-266 26.03,-296.45 C36,-316 52,-336 66,-348 M3,-74 C16,-96 32,-134 36.22,-170.73 C40,-210 50,-254 57.97,-283.55 C61,-296 64,-308 68,-318"/>
    <clipPath id="t1-clip"><use href="#t1-blade"/></clipPath>

    <!-- Template 2: broad leaf -->
    <path id="t2-stem" d="M0,4 C0,-16 -0.4,-36 0.3,-60"/>
    <path id="t2-blade" d="M0,-56 C-13.79,-67.57 -31.5,-107.73 -25.26,-137.07 C-18.19,-170.33 -4.59,-205.95 12.81,-225.27 C28.87,-243.11 55.08,-265.2 76,-272 C68.48,-251.33 60.18,-226.21 55.19,-202.73 C49.37,-175.34 46.47,-152.47 41.26,-122.93 C36.05,-93.39 12.73,-68.73 0,-56 Z"/>
    <path id="t2-shade" d="M0,-56 C1.74,-80.94 2.8,-105.55 8,-130 C14.24,-159.34 19.91,-187.51 34,-214 C45.27,-235.19 58.74,-255.33 76,-272 C68.48,-251.33 60.18,-226.21 55.19,-202.73 C49.37,-175.34 46.47,-152.47 41.26,-122.93 C36.05,-93.39 12.73,-68.73 0,-56 Z"/>
