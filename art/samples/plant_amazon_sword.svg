    <path id="t3-veins" d="M0.5,-78 C-5,-110 -10,-150 -9.94,-191.39 C-9.9,-234 -3,-286 11.24,-322.29 C20,-346 32,-384 44,-408 M1.5,-76 C10,-104 19,-150 21.94,-188.61 C25,-232 29,-280 32.76,-317.71 C35,-344 40,-380 45,-406 M-0.5,-80 C-9,-108 -17,-150 -17.91,-192.09 C-18.6,-234 -10,-288 5.86,-323.43 C14,-342 22,-362 30,-378 M2.5,-74 C14,-100 27,-146 29.91,-187.91 C32.5,-230 36,-280 38.14,-316.57 C39,-330 40,-342 40.5,-352"/>
    <clipPath id="t3-clip"><use href="#t3-blade"/></clipPath>
  </defs>

