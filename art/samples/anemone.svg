<svg xmlns="http://www.w3.org/2000/svg" width="280" height="220" viewBox="0 0 280 220">
  <!--
    Bubble-tip anemone on a rock: lavender tentacles with hot-pink bulb tips
    and pale nipple tips, magenta column, cool stone rock.
    Each tentacle = stalk (outline stroke, then fill stroke) + swollen bulb.
    It is drawn base-at-origin pointing up and placed with
    translate(base) rotate(angle). Left-leaning ones add scale(-1 1) so
    curves bend outward and the bulb highlight stays on top.
  -->
  <defs>
    <!-- bulb shape, centred on its widest point; neck at y=14, tip at y=-17 -->
    <path id="bulb" d="M-6 14 C-9.5 10 -11 5 -11 0 C-11 -6 -8.5 -10 -5 -12 C-4.2 -14.5 -2.6 -17 0 -17 C2.6 -17 4.2 -14.5 5 -12 C8.5 -10 11 -6 11 0 C11 5 9.5 10 6 14 Z"/>
    <path id="neckShade" d="M-8.5 4 C-7.5 8 -6 11 -4.5 12.5 L4.5 12.5 C6 11 7.5 8 8.5 4 C5 7 -5 7 -8.5 4 Z"/>
    <path id="blush" d="M-9 -4 C-8.6 -8 -6.8 -10.2 -4.5 -11.2 L4.5 -11.2 C6.8 -10.2 8.6 -8 9 -4 C5 -6.6 -5 -6.6 -9 -4 Z"/>
    <path id="nipple" d="M-4.4 -11.2 C-3.8 -13.8 -2.4 -15.4 0 -15.4 C2.4 -15.4 3.8 -13.8 4.4 -11.2 C2 -10.2 -2 -10.2 -4.4 -11.2 Z"/>

    <!-- bulbs and bulb details per depth tone: B back, M middle, F front -->
    <use id="bB" href="#bulb" fill="#9A84CC" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
    <use id="bM" href="#bulb" fill="#B9A2E0" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
    <use id="bF" href="#bulb" fill="#C9B8E8" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
    <g id="dB">
      <use href="#neckShade" fill="#7A64B0"/>
      <use href="#blush" fill="#C9579A"/>
      <use href="#nipple" fill="#DFA0C4"/>
      <ellipse cx="-5.6" cy="-1" rx="2.2" ry="4.4" transform="rotate(-10 -5.6 -1)" fill="#B4A0DC"/>
    </g>
    <g id="dM">
      <use href="#neckShade" fill="#957CC8"/>
      <use href="#blush" fill="#E45FA2"/>
      <use href="#nipple" fill="#EBB4D2"/>
      <ellipse cx="-5.6" cy="-1" rx="2.2" ry="4.4" transform="rotate(-10 -5.6 -1)" fill="#D0C1EA"/>
    </g>
    <g id="dF">
      <use href="#neckShade" fill="#A792D6"/>
      <use href="#blush" fill="#EB6AA8"/>
      <use href="#nipple" fill="#EBC0DA"/>
      <ellipse cx="-5.6" cy="-1" rx="2.2" ry="4.4" transform="rotate(-10 -5.6 -1)" fill="#DACEEA"/>
    </g>

    <!-- back tone, long -->
    <g id="B_s90">
      <path d="M0 0 V-59" stroke="#2A2745" stroke-width="15" stroke-linecap="round" fill="none"/>
      <use href="#bB" y="-73"/>
      <path d="M0 0 V-64" stroke="#9A84CC" stroke-width="9" stroke-linecap="round" fill="none"/>
      <use href="#dB" y="-73"/>
    </g>
    <g id="B_c90">
      <path d="M0 0 C0 -22 4 -42 12 -54" stroke="#2A2745" stroke-width="15" stroke-linecap="round" fill="none"/>
      <use href="#bB" transform="translate(19.8 -65.6) rotate(33.7)"/>
      <path d="M0 0 C0 -22 4 -42 12 -54 L14.8 -58.2" stroke="#9A84CC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <use href="#dB" transform="translate(19.8 -65.6) rotate(33.7)"/>
    </g>
    <!-- middle tone -->
    <g id="M_s75">
      <path d="M0 0 V-44" stroke="#2A2745" stroke-width="15" stroke-linecap="round" fill="none"/>
      <use href="#bM" y="-58"/>
      <path d="M0 0 V-49" stroke="#B9A2E0" stroke-width="9" stroke-linecap="round" fill="none"/>
      <use href="#dM" y="-58"/>
    </g>
    <g id="M_c75">
      <path d="M0 0 C0 -16 3 -30 10 -40" stroke="#2A2745" stroke-width="15" stroke-linecap="round" fill="none"/>
      <use href="#bM" transform="translate(18 -51.5) rotate(35)"/>
      <path d="M0 0 C0 -16 3 -30 10 -40 L12.9 -44.1" stroke="#B9A2E0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <use href="#dM" transform="translate(18 -51.5) rotate(35)"/>
    </g>
    <!-- front tone -->
    <g id="F_s60">
      <path d="M0 0 V-29" stroke="#2A2745" stroke-width="15" stroke-linecap="round" fill="none"/>
      <use href="#bF" y="-43"/>
      <path d="M0 0 V-34" stroke="#C9B8E8" stroke-width="9" stroke-linecap="round" fill="none"/>
      <use href="#dF" y="-43"/>
    </g>
    <g id="F_c60">
      <path d="M0 0 C0 -10 2 -20 7 -27" stroke="#2A2745" stroke-width="15" stroke-linecap="round" fill="none"/>
      <use href="#bF" transform="translate(15.1 -38.4) rotate(35.5)"/>
      <path d="M0 0 C0 -10 2 -20 7 -27 L9.9 -31.1" stroke="#C9B8E8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <use href="#dF" transform="translate(15.1 -38.4) rotate(35.5)"/>
    </g>
    <g id="F_s45">
      <path d="M0 0 V-14" stroke="#2A2745" stroke-width="15" stroke-linecap="round" fill="none"/>
      <use href="#bF" y="-28"/>
      <path d="M0 0 V-19" stroke="#C9B8E8" stroke-width="9" stroke-linecap="round" fill="none"/>
      <use href="#dF" y="-28"/>
    </g>
  </defs>

  <g id="base" data-pivot="140 212">
    <!-- small front-left stone -->
    <!-- main rock -->
    <path d="M36 212 C28 196 36 177 58 168 C74 161 94 160 108 163 C122 156 160 155 174 161 C192 157 216 162 232 174 C248 186 252 204 244 212 Z" fill="#6F7A8C"/>
    <path d="M44 178 C54 169 72 164 90 165 C100 161 106 163 112 165 C128 159 158 158 172 164 C190 160 212 165 228 176 C214 172 198 170 184 172 C166 168 150 168 138 171 C120 168 104 170 92 174 C74 172 58 174 44 178 Z" fill="#8A95A8"/>
    <path d="M32 198 C62 205 104 204 142 200 C180 205 224 205 250 196 C251 203 249 209 244 212 L36 212 C34 208 32.5 203 32 198 Z" fill="#525A70"/>
    <g stroke="#525A70" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 186 C76 182 82 185 87 180"/>
      <path d="M200 184 C207 181 212 184 218 179"/>
      <path d="M100 194 C106 191 111 193 116 190"/>
      <path d="M176 194 C180 191 186 192 190 189"/>
    </g>
    <circle cx="58" cy="192" r="2.4" fill="#525A70"/>
    <circle cx="228" cy="192" r="2" fill="#525A70"/>
    <circle cx="160" cy="190" r="2.2" fill="#525A70"/>
    <path d="M36 212 C28 196 36 177 58 168 C74 161 94 160 108 163 C122 156 160 155 174 161 C192 157 216 162 232 174 C248 186 252 204 244 212 Z" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>

    <!-- column: short, fleshy, gripping the rock with a spread foot -->
    <path d="M106 170 C114 162 118 146 114 132 C111 122 114 112 126 109 L154 109 C166 112 169 122 166 132 C162 146 166 162 174 170 C160 175 120 175 106 170 Z" fill="#C2378E"/>
    <path d="M112 166 C118 156 121 144 118 132 C116 124 118 116 126 113 C131 128 131 150 127 170 C121 169 116 168 112 166 Z" fill="#D9559F"/>
    <path d="M153 171 C150 152 149 130 156 114 C162 117 165 124 163 132 C160 146 163 160 170 168 C164 170 158 171 153 171 Z" fill="#8E2A78"/>
    <g stroke="#A02C7C" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M136 166 C135 152 136 136 134 122"/>
      <path d="M145 166 C146 152 145 137 147 122"/>
    </g>
    <g fill="#E07AB4">
      <circle cx="121" cy="150" r="1.6"/>
      <circle cx="123" cy="138" r="1.4"/>
      <circle cx="120" cy="160" r="1.4"/>
    </g>
    <path d="M106 170 C114 162 118 146 114 132 C111 122 114 112 126 109 L154 109 C166 112 169 122 166 132 C162 146 166 162 174 170 C160 175 120 175 106 170 Z" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g id="tentacles" data-pivot="140 112">
    <!-- dense dark core so gaps read as depth, not water -->
    <path d="M60 108 C56 74 84 44 140 42 C196 44 224 74 220 108 C210 124 176 128 140 126 C104 128 70 124 60 108 Z" fill="#5E4A8E" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>

    <!-- back row -->
    <use href="#B_s90" transform="translate(96 122) rotate(-88) scale(-1 1)"/>
    <use href="#B_s90" transform="translate(184 121) rotate(86)"/>
    <use href="#B_c90" transform="translate(100 117) rotate(-72) scale(-1 1)"/>
    <use href="#B_c90" transform="translate(180 116) rotate(68)"/>
    <use href="#B_s90" transform="translate(108 112) rotate(-56) scale(-1 1)"/>
    <use href="#B_s90" transform="translate(172 112) rotate(54)"/>
    <use href="#B_c90" transform="translate(118 108) rotate(-40) scale(-1 1)"/>
    <use href="#B_c90" transform="translate(162 109) rotate(36)"/>
    <use href="#B_s90" transform="translate(126 106) rotate(-22) scale(-1 1)"/>
    <use href="#B_s90" transform="translate(156 107) rotate(22)"/>
    <use href="#B_c90" transform="translate(134 105) rotate(-14) scale(-1 1)"/>
    <use href="#B_s90" transform="translate(146 105) rotate(4)"/>

    <!-- middle row -->
    <use href="#M_s75" transform="translate(100 126) rotate(-106) scale(-1 1)"/>
    <use href="#M_c75" transform="translate(180 126) rotate(100)"/>
    <use href="#M_c75" transform="translate(102 120) rotate(-82) scale(-1 1)"/>
    <use href="#M_s75" transform="translate(178 120) rotate(80)"/>
    <use href="#M_s75" transform="translate(108 116) rotate(-64) scale(-1 1)"/>
    <use href="#M_c75" transform="translate(172 116) rotate(58)"/>
    <use href="#M_c75" transform="translate(116 112) rotate(-46) scale(-1 1)"/>
    <use href="#M_s75" transform="translate(164 112) rotate(42)"/>
    <use href="#M_s75" transform="translate(124 110) rotate(-30) scale(-1 1)"/>
    <use href="#M_c75" transform="translate(156 110) rotate(18)"/>
    <use href="#M_c75" transform="translate(134 109) rotate(-10) scale(-1 1)"/>
    <use href="#M_s75" transform="translate(147 109) rotate(6)"/>
    <use href="#M_s75" transform="translate(140 110) rotate(-2) scale(-1 1)"/>

    <!-- front row -->
    <use href="#F_s60" transform="translate(110 130) rotate(-116) scale(-1 1)"/>
    <use href="#F_c60" transform="translate(170 130) rotate(110)"/>
    <use href="#F_c60" transform="translate(108 125) rotate(-88) scale(-1 1)"/>
    <use href="#F_s60" transform="translate(172 125) rotate(90)"/>
    <use href="#F_s60" transform="translate(112 120) rotate(-66) scale(-1 1)"/>
    <use href="#F_c60" transform="translate(168 120) rotate(62)"/>
    <use href="#F_c60" transform="translate(120 116) rotate(-40) scale(-1 1)"/>
    <use href="#F_s60" transform="translate(160 116) rotate(40)"/>
    <use href="#F_s60" transform="translate(130 114) rotate(-20) scale(-1 1)"/>
    <use href="#F_c60" transform="translate(150 114) rotate(12)"/>
    <use href="#F_c60" transform="translate(139 113) rotate(-6) scale(-1 1)"/>

    <!-- short front bulbs and tentacles drooping over the column -->
    <use href="#F_s45" transform="translate(120 124) rotate(-58) scale(-1 1)"/>
    <use href="#F_s45" transform="translate(160 124) rotate(54)"/>
    <use href="#F_s45" transform="translate(131 121) rotate(-28) scale(-1 1)"/>
    <use href="#F_s45" transform="translate(150 121) rotate(24)"/>
    <use href="#F_s45" transform="translate(140 120) rotate(-2) scale(-1 1)"/>
    <use href="#F_s45" transform="translate(122 128) rotate(-104) scale(-1 1)"/>
    <use href="#F_s45" transform="translate(158 128) rotate(100)"/>
  </g>
</svg>
