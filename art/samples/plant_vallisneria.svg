    <linearGradient id="g-deep" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="612">
      <stop offset="0" stop-color="#38884A"/>
      <stop offset="1" stop-color="#286A38"/>
    </linearGradient>
    <linearGradient id="g-leaf" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="0" y2="612">
      <stop offset="0" stop-color="#5CB646"/>
      <stop offset="1" stop-color="#44943A"/>
    </linearGradient>
    <linearGradient id="g-mid" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="612">
      <stop offset="0" stop-color="#82C844"/>
      <stop offset="1" stop-color="#62AA3A"/>
    </linearGradient>
    <linearGradient id="g-lime" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="612">
      <stop offset="0" stop-color="#A9DB46"/>
      <stop offset="1" stop-color="#88C038"/>
    </linearGradient>

