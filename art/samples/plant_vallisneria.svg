<svg xmlns="http://www.w3.org/2000/svg" width="220" height="620" viewBox="0 0 220 620">
  <!-- Vallisneria clump: 8 ribbon leaves from one base, drawn back to front.
       Each frond is a top-level group that sways around its base pivot.
       Bottom ~25 px sits under the gravel. Highlight runs on the upper/outer
       edge of each ribbon, shadow on the lower/inner edge. -->
