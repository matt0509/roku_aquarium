<svg xmlns="http://www.w3.org/2000/svg" width="210" height="160" viewBox="0 0 210 160">
  <defs>
    <path id="tg-tail-shape" d="M 66 71 L 53 71.5 C 42 63, 28 50, 8 40 C 18 54, 23 67, 24 81 C 23 95, 18 108, 8 121 C 28 111, 42 98, 53 89.5 L 66 89 Z"/>
    <path id="tg-body-shape" d="M 206 90 C 199 86, 191 80, 186 73 C 181 64, 175 52, 163 44 C 143 32, 110 32, 88 42 C 76 48, 65 60, 59 71 C 57.5 76, 57.5 84, 59 89 C 65 100, 78 111, 98 118 C 116 125, 138 128, 156 125 C 176 121, 196 106, 206 90 Z"/>
    <path id="tg-dorsal-shape" d="M 166 50 C 162 40, 156 30, 148 22 C 132 10, 112 6, 94 7 C 78 8, 64 20, 57 36 C 53 46, 53 60, 58 70 L 70 62 L 100 46 L 158 50 Z"/>
    <path id="tg-anal-shape" d="M 160 118 C 152 134, 136 146, 116 150 C 98 153, 80 147, 68 134 C 60 124, 57 106, 58 90 L 72 94 L 110 112 L 154 112 Z"/>
    <path id="tg-pelvic-shape" d="M 177 112 C 176 123, 170 134, 158 141 C 154 143, 151 141, 152 137 C 154 129, 158 120, 165 113 Z"/>
    <path id="tg-pect-shape" d="M 153 85 C 143 79, 131 77, 120 79 C 123 88, 134 97, 151 99 C 154 95, 155 89, 153 85 Z"/>
    <clipPath id="tg-clip-tail"><use href="#tg-tail-shape"/></clipPath>
    <clipPath id="tg-clip-body"><use href="#tg-body-shape"/></clipPath>
    <clipPath id="tg-clip-dorsal"><use href="#tg-dorsal-shape"/></clipPath>
    <clipPath id="tg-clip-anal"><use href="#tg-anal-shape"/></clipPath>
    <clipPath id="tg-clip-pelvic"><use href="#tg-pelvic-shape"/></clipPath>
    <clipPath id="tg-clip-pect"><use href="#tg-pect-shape"/></clipPath>
    <linearGradient id="tg-grad-tail" x1="0" y1="40" x2="0" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A8A8A8"/>
      <stop offset="1" stop-color="#868686"/>
    </linearGradient>
    <linearGradient id="tg-grad-ped" x1="59" y1="0" x2="96" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E8E8E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8E8E8E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- TAIL: crescent caudal fin, pivot at the caudal joint -->
  <g id="tail" data-pivot="58 80">
    <use href="#tg-tail-shape" fill="url(#tg-grad-tail)"/>
    <g clip-path="url(#tg-clip-tail)">
      <g fill="none" stroke="#767676" stroke-width="1.3" stroke-linecap="round">
        <path d="M 53 76 L 13 45"/>
        <path d="M 53 78 L 19 61"/>
        <path d="M 53 80.5 L 22 81"/>
        <path d="M 53 83 L 19 101"/>
        <path d="M 53 85 L 13 117"/>
      </g>
      <path d="M 13 40 C 23 54, 28 67, 29 81 C 28 95, 23 108, 13 121" fill="none" stroke="#CFCFCF" stroke-width="4" stroke-linecap="round"/>
    </g>
    <use href="#tg-tail-shape" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- BODY: fins behind, disc body, shading, pattern, gill, pectoral, eye -->
  <g id="body" data-pivot="130 82">
    <!-- dorsal fin -->
    <use href="#tg-dorsal-shape" fill="#C8C8C8"/>
    <g clip-path="url(#tg-clip-dorsal)">
      <g fill="none" stroke="#A6A6A6" stroke-width="1.3" stroke-linecap="round">
        <path d="M 156 44 L 146 18"/>
        <path d="M 142 38 L 132 8"/>
        <path d="M 126 36 L 116 4"/>
        <path d="M 110 37 L 100 4"/>
        <path d="M 96 41 L 84 6"/>
        <path d="M 84 47 L 70 12"/>
        <path d="M 75 54 L 60 26"/>
        <path d="M 67 62 L 55 46"/>
      </g>
      <use href="#tg-dorsal-shape" fill="none" stroke="#7C7C7C" stroke-width="13"/>
    </g>
    <use href="#tg-dorsal-shape" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- anal fin -->
    <use href="#tg-anal-shape" fill="#BABABA"/>
    <g clip-path="url(#tg-clip-anal)">
      <g fill="none" stroke="#9C9C9C" stroke-width="1.3" stroke-linecap="round">
        <path d="M 148 122 L 140 144"/>
        <path d="M 134 124 L 126 152"/>
        <path d="M 118 122 L 110 156"/>
        <path d="M 102 118 L 92 154"/>
        <path d="M 88 112 L 76 146"/>
        <path d="M 76 104 L 62 130"/>
        <path d="M 68 96 L 56 108"/>
      </g>
      <use href="#tg-anal-shape" fill="none" stroke="#727272" stroke-width="13"/>
    </g>
    <use href="#tg-anal-shape" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- pelvic fin -->
    <use href="#tg-pelvic-shape" fill="#AEAEAE"/>
    <g clip-path="url(#tg-clip-pelvic)">
      <path d="M 168 120 L 157 137" fill="none" stroke="#8C8C8C" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <use href="#tg-pelvic-shape" fill="none" stroke="#2A2745" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- body disc -->
    <use href="#tg-body-shape" fill="#DADADA"/>
    <g clip-path="url(#tg-clip-body)">
      <!-- top highlight -->
      <path d="M 210 0 L 40 0 L 40 74 L 62 74 C 70 62, 80 54, 92 50 C 114 41, 146 41, 166 53 C 175 59, 180 66, 184 74 L 210 74 Z" fill="#EAEAEA"/>
      <!-- faint longitudinal lines -->
      <g fill="none" stroke="#6A6A6A" stroke-width="1.5" stroke-linecap="round" opacity="0.13">
        <path d="M 92 58 C 112 51, 134 50, 150 55"/>
        <path d="M 78 71 C 102 64, 128 63, 148 68"/>
        <path d="M 72 84 C 98 78, 124 78, 144 82"/>
        <path d="M 80 97 C 102 93, 124 94, 142 97"/>
      </g>
      <!-- belly shadow -->
      <path d="M 0 160 L 0 94 L 62 96 C 80 107, 104 113, 132 113 C 158 113, 178 106, 196 96 L 210 96 L 210 160 Z" fill="#A0A0A0"/>
      <!-- darker peduncle -->
      <rect x="40" y="40" width="60" height="100" fill="url(#tg-grad-ped)"/>
    </g>
    <!-- outline: heavy where the body meets water, light where it meets the fins -->
    <path d="M 163 44 C 143 32, 110 32, 88 42 C 76 48, 65 60, 59 71" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round"/>
    <path d="M 59 89 C 65 100, 78 111, 98 118 C 116 125, 138 128, 156 125" fill="none" stroke="#5A5A5A" stroke-width="2" stroke-linecap="round"/>
    <path d="M 156 125 C 176 121, 196 106, 206 90 C 199 86, 191 80, 186 73 C 181 64, 175 52, 163 44" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 59 71 C 57.5 76, 57.5 84, 59 89" fill="none" stroke="#2A2745" stroke-width="3" stroke-linecap="round"/>

    <!-- scalpel -->
    <path d="M 61 80 C 66 76.5, 75 76.5, 82 80 C 75 83.5, 66 83.5, 61 80 Z" fill="#E6E6E6" stroke="#5E5E5E" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- gill cover -->
    <path d="M 158 52 C 150 66, 149 94, 160 112" fill="none" stroke="#6A6A6A" stroke-width="1.75" stroke-linecap="round"/>

    <!-- pectoral fin -->
    <use href="#tg-pect-shape" fill="#C4C4C4" opacity="0.72"/>
    <g clip-path="url(#tg-clip-pect)">
      <g fill="none" stroke="#8E8E8E" stroke-width="1.2" stroke-linecap="round">
        <path d="M 152 87 L 124 80"/>
        <path d="M 152 90 L 126 86"/>
        <path d="M 152 93 L 130 92"/>
        <path d="M 152 96 L 138 97"/>
      </g>
    </g>
    <path d="M 153 85 C 154.5 89, 154 95, 151 99" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 153 85 C 143 79, 131 77, 120 79 C 123 88, 134 97, 151 99" fill="none" stroke="#2A2745" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- mouth -->
    <path d="M 203.5 90.8 L 199 92" fill="none" stroke="#6A6A6A" stroke-width="1.5" stroke-linecap="round"/>

    <!-- eye -->
    <circle cx="166" cy="62" r="9.5" fill="#E6E6E6" stroke="#2A2745" stroke-width="2.5"/>
    <circle cx="167" cy="62.5" r="6" fill="#1C1C1C"/>
    <circle cx="164.6" cy="59.6" r="2" fill="#EAEAEA"/>
  </g>
</svg>
