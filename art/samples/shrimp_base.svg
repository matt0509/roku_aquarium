    <path id="p-fan" d="M 40.4 30.4 C 37 29.4 33.4 29.4 30.8 30.6 C 30 31.8 30.4 33 31.6 33.8 C 30.2 34.8 29.8 36 30.4 37.2 C 31 38.2 32 38.6 33.2 38.6 C 32.6 39.8 33 41 34.2 41.6 C 37.4 40.4 40.6 38.6 43.4 36.4 Z"/>
    <clipPath id="clip-body"><use href="#p-body"/></clipPath>
    <clipPath id="clip-fan"><use href="#p-fan"/></clipPath>
    <linearGradient id="g-body" x1="0" y1="18" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E2E2"/>
      <stop offset="0.5" stop-color="#DADADA"/>
      <stop offset="1" stop-color="#D0D0D0"/>
    </linearGradient>
    <linearGradient id="g-ant" x1="94" y1="0" x2="9" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A8A8A" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#8A8A8A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8A8A8A" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <g id="legs" data-pivot="78 37.5">
    <!-- far-side legs: thin and faint, behind everything -->
    <g fill="none" stroke="#8A8A8A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <polyline points="84,36 90.4,42 93,50.8"/>
      <polyline points="80.8,36.8 85.6,43.4 86,51.6"/>
      <polyline points="77.2,37.4 79.2,44.2 77.6,51.8"/>
      <polyline points="73.4,37.8 72.8,44.6 68.6,51.8"/>
    </g>
    <!-- swimmerets under the abdomen -->
    <g fill="#D4D4D4" fill-opacity="0.7" stroke="#2A2745" stroke-width="1" stroke-opacity="0.7">
      <ellipse cx="67.4" cy="41" rx="1.3" ry="2.9" transform="rotate(-28 67.4 41)"/>
      <ellipse cx="62" cy="41.8" rx="1.3" ry="3" transform="rotate(-28 62 41.8)"/>
      <ellipse cx="56.4" cy="41.4" rx="1.3" ry="3" transform="rotate(-28 56.4 41.4)"/>
      <ellipse cx="51.2" cy="39.8" rx="1.2" ry="2.7" transform="rotate(-24 51.2 39.8)"/>
      <ellipse cx="47" cy="38.2" rx="1.1" ry="2.4" transform="rotate(-20 47 38.2)"/>
    </g>
    <!-- near-side walking legs (P1 is the little feeding claw) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <g stroke="#2A2745" stroke-width="2.5">
        <polyline points="85,35 89.5,38.6 92.8,41"/>
        <polyline points="82.6,36.2 87.6,42.8 89,51.8"/>
        <polyline points="79.4,37 82.4,44 81.4,52.4"/>
        <polyline points="75.6,37.6 75.4,44.6 72.2,52.6"/>
        <polyline points="71.8,38 68.6,44.4 63.4,52.2"/>
      </g>
      <g stroke="#D0D0D0" stroke-width="1.1">
        <polyline points="85,35 89.5,38.6 92.8,41"/>
        <polyline points="82.6,36.2 87.6,42.8 89,51.8"/>
        <polyline points="79.4,37 82.4,44 81.4,52.4"/>
        <polyline points="75.6,37.6 75.4,44.6 72.2,52.6"/>
        <polyline points="71.8,38 68.6,44.4 63.4,52.2"/>
      </g>
    </g>
  </g>

  <g id="body" data-pivot="64 30">
    <!-- antennal scale (behind the head) -->
    <path d="M 86.5 29.8 C 89.5 28.8 93.5 28.8 96 29.8 C 93.6 31.6 90 32.3 86.8 32.1 Z" fill="#DADADA" fill-opacity="0.8" stroke="#2A2745" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- tail fan -->
    <use href="#p-fan" fill="#DADADA"/>
    <g clip-path="url(#clip-fan)">
      <path d="M 28 37.6 C 34 37.2 39 35.8 44 33.6 L 44 44 L 28 44 Z" fill="#A0A0A0"/>
      <path d="M 31.4 31.4 C 34.5 30.8 37.6 31 40.2 31.6" fill="none" stroke="#EAEAEA" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 41.4 33.4 C 38 33.2 34.6 33.4 31.8 33.9 M 42 35.2 C 38.6 36.4 35.6 37.4 33.4 38.6" fill="none" stroke="#6A6A6A" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8"/>
    </g>
    <use href="#p-fan" fill="none" stroke="#2A2745" stroke-width="2" stroke-linejoin="round"/>

    <!-- main body -->
    <use href="#p-body" fill="url(#g-body)"/>
    <g clip-path="url(#clip-body)">
      <!-- underside shadow -->
      <path d="M 38 32.6 C 44 32.4 50 34.2 58 35 C 66 35.6 74 35.2 80 34.4 C 84 33.8 87 32 90 30 L 92 44 L 38 44 Z" fill="#A0A0A0"/>
      <!-- segment margins (soft) -->
      <g fill="none" stroke="#6A6A6A" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.45">
        <path d="M 70.2 20.8 C 68.6 26 68.4 32 69.6 38.4"/>
        <path d="M 64.4 19.4 C 62.8 25 62.6 32 64.2 39.6"/>
        <path d="M 58.6 18.6 C 56.8 24.5 56.8 32 58.6 39.7"/>
        <path d="M 52.6 19.6 C 50.8 25 51 32 53.4 38.9"/>
        <path d="M 47.4 22.4 C 45.8 27 46.6 33 49.6 37.4"/>
        <path d="M 43.8 25.6 C 42.6 29 43.6 33.4 46.4 36.1"/>
      </g>
      <!-- top highlight -->
      <path d="M 92.6 26.3 C 86 25.2 78 23.6 70.4 22.8 C 66 21.9 62 20.6 58 20.6 C 54 20.6 50.6 22.2 47.8 24.6" fill="none" stroke="#EAEAEA" stroke-width="2.2" stroke-linecap="round"/>
      <!-- carapace gill line -->
      <path d="M 85.6 33.4 C 81 31.6 76.4 31.2 72.4 31.8" fill="none" stroke="#6A6A6A" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.45"/>
    </g>
    <use href="#p-body" fill="none" stroke="#2A2745" stroke-width="2" stroke-linejoin="round"/>

    <!-- eye on a short stalk -->
    <circle cx="88.6" cy="27.3" r="2.7" fill="#2A2745"/>
    <circle cx="87.8" cy="26.4" r="0.9" fill="#EAEAEA"/>
  </g>

  <g id="antennae" data-pivot="90 29.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- long antennae sweeping back over the body -->
    <path d="M 90 29.6 C 93.6 25 94.6 18 89 13.6 C 83 9 68 8.4 54 9.4 C 38 10.6 23 14 9.5 19.6" stroke="url(#g-ant)" stroke-width="1.5"/>
    <path d="M 89.6 30.2 C 92.6 26.2 93 20.6 88 17.2 C 82 13.2 68 13 55 14 C 41 15 28 18 15 23.6" stroke="url(#g-ant)" stroke-width="1.3"/>
    <!-- antennules -->
    <path d="M 88.6 28.8 L 93 27.4" stroke="#2A2745" stroke-width="2.5"/>
    <path d="M 88.6 28.8 L 93 27.4" stroke="#B4B4B4" stroke-width="1"/>
    <path d="M 93 27.4 C 96.5 26 99.5 24.8 103 24.4" stroke="#6A6A6A" stroke-width="1.3"/>
    <path d="M 93 27.4 C 96.5 27.2 99.5 27.6 102.4 28.6" stroke="#6A6A6A" stroke-width="1.3"/>
  </g>
</svg>
