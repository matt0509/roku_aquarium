      <path d="M 40 35.6 C 46 34.4 52 34.8 58 35.2 C 66 35.6 74 35.4 80 34.8 C 83 34.6 85.6 33.8 88 32.6 L 92 44 L 38 44 Z" fill="#A0A0A0"/>
      <!-- segment margins (soft) -->
      <g fill="none" stroke="#6A6A6A" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.42">
        <path d="M 70.2 20.8 C 68.4 26 68.2 32 69.6 38.6"/>
        <path d="M 64.4 19.2 C 62.4 25 62.4 32 64.2 39.6"/>
        <path d="M 58.6 18.4 C 56.4 24.5 56.6 32 58.8 39.8"/>
        <path d="M 52.8 19.4 C 50.6 25 51 32 54.4 38.9"/>
        <path d="M 48.2 21.6 C 46.2 26.4 47.2 32.6 51 37.6"/>
        <path d="M 45 25.4 C 43.6 29 45 33.4 48.6 36.6"/>
