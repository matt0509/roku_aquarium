    <path id="p-fan" d="M 42.8 30.8 C 39.8 31 36.2 32.2 34 34 C 32.9 35 33.1 36.4 34.3 36.8 C 35.2 37.1 36 37.3 36.7 37.3 C 35.9 38.4 35.7 39.8 36.6 40.6 C 37.4 41.3 38.5 41.1 39.3 40.5 C 39.2 41.6 39.7 42.4 40.8 42.8 C 43.2 41.8 45.6 39.2 47.2 36.4 Z"/>
    <clipPath id="clip-body"><use href="#p-body"/></clipPath>
