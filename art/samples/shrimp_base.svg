    <use href="#p-fan" fill="none" stroke="#2A2745" stroke-width="2" stroke-linejoin="round"/>

    <!-- main body -->
    <use href="#p-body" fill="url(#g-body)"/>
    <g clip-path="url(#clip-body)">
