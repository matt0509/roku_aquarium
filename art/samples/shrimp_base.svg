    <path d="M 87 29.8 C 90 28.8 94 28.8 96.4 29.8 C 94 31.6 90.4 32.3 87.2 32.1 Z" fill="#DADADA" fill-opacity="0.8" stroke="#2A2745" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- tail fan -->
    <use href="#p-fan" fill="#DADADA"/>
    <g clip-path="url(#clip-fan)">
      <path d="M 48 35.8 C 44.6 38.4 41 40.2 35.4 41.2 L 35.4 46 L 48 46 Z" fill="#A0A0A0"/>
      <path d="M 41.8 32 C 39.4 32.3 37 33.2 35.2 34.6" fill="none" stroke="#EAEAEA" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M 43.6 33.8 C 41.4 34.8 39.4 35.8 37.4 36.9 M 45 35.4 C 43.2 36.8 41.4 38.4 39.8 40" fill="none" stroke="#6A6A6A" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.8"/>
