    <linearGradient id="g-body" x1="0" y1="18" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2E2E2"/>
      <stop offset="0.5" stop-color="#DADADA"/>
      <stop offset="1" stop-color="#D0D0D0"/>
    </linearGradient>
    <linearGradient id="g-ant" x1="94" y1="0" x2="9" y2="0" gradientUnits="userSpaceOnUse">
