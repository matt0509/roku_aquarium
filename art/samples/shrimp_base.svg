  <g id="antennae" data-pivot="90 29" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- long antennae sweeping back over the body -->
    <path d="M 90 29 C 94 24.6 95 17.6 89.4 13.2 C 83.4 8.6 68 8 54 9 C 38 10.2 23 13.6 9.5 19.2" stroke="url(#g-ant)" stroke-width="1.5"/>
    <path d="M 89.6 29.6 C 93 25.6 93.4 20.2 88.4 16.8 C 82.4 12.8 68 12.6 55 13.6 C 41 14.6 28 17.6 15 23.2" stroke="url(#g-ant)" stroke-width="1.3"/>
    <!-- antennules -->
    <path d="M 89 28 L 93.4 26.6" stroke="#2A2745" stroke-width="2.5"/>
    <path d="M 89 28 L 93.4 26.6" stroke="#B4B4B4" stroke-width="1"/>
    <path d="M 93.4 26.6 C 97 25.2 100 24 103.4 23.6" stroke="#6A6A6A" stroke-width="1.3"/>
    <path d="M 93.4 26.6 C 97 26.4 100 26.8 102.8 27.8" stroke="#6A6A6A" stroke-width="1.3"/>
