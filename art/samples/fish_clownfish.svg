      <path d="M 0 57 C 15 56, 30 55, 50 54 L 50 100 L 0 100 Z" fill="#3B2A6E" opacity="0.3"/>
      <g fill="none" stroke="#B5531C" stroke-width="1.5" stroke-linecap="round">
        <path d="M 36 49 L 15 36"/>
        <path d="M 36 51 L 11 44"/>
        <path d="M 36 52.5 L 10 52.5"/>
        <path d="M 36 54 L 11 61"/>
        <path d="M 36 56 L 15 69"/>
      </g>
      <path d="M 44 43 C 34 39, 24 31, 14 31 C 7 31, 5 42, 5 52 C 5 63, 7 73, 14 73 C 24 73, 34 65, 44 61" fill="none" stroke="#2A2745" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
