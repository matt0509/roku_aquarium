  <!-- TAIL: drawn first, pivot at the caudal joint -->
  <g id="tail" data-pivot="40 52">
    <path d="M 44 43 C 34 39, 24 31, 14 31 C 7 31, 5 42, 5 52 C 5 63, 7 73, 14 73 C 24 73, 34 65, 44 61 Z" fill="#E8731C"/>
    <g clip-path="url(#cf-clip-tail)">
