<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
  <defs>
    <clipPath id="cf-clip-body">
      <path d="M 154 54 C 154 40, 146 28, 128 25 C 105 19.5, 75 23.5, 58 33 C 49 37, 43 41, 37 43 L 37 62 C 44 66, 56 74, 72 78 C 92 83, 120 82, 138 74 C 148 69, 154 62, 154 54 Z"/>
