    <path d="M 44 43 C 34 39, 24 31, 14 31 C 7 31, 5 42, 5 52 C 5 63, 7 73, 14 73 C 24 73, 34 65, 44 61 Z" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- BODY: fins behind, body with bands, eye -->
  <g id="body" data-pivot="96 53">
    <!-- dorsal fin: spiny front part, notch, soft rear part -->
    <path d="M 125 29 C 123 20, 117 14, 109 13.5 Q 105 11.8, 102 14.5 Q 98.5 12.3, 95 15 Q 92 14, 89.5 18.5 C 87.5 13, 81 9.5, 72 9.5 C 61 9.5, 54 17, 50 31 L 54 40 L 126 34 Z" fill="#E8731C"/>
    <g clip-path="url(#cf-clip-dorsal)">
      <path d="M 0 0 L 160 0 L 160 20 C 120 13, 80 12, 40 20 Z" fill="#E4E8EA" opacity="0.25"/>
      <g fill="none" stroke="#B5531C" stroke-width="1.4" stroke-linecap="round">
        <path d="M 60 30 L 60 16"/>
        <path d="M 68 29 L 68 13"/>
        <path d="M 75 28 L 76 13"/>
        <path d="M 105 24 L 104.5 16"/>
        <path d="M 112 25 L 111 17"/>
        <path d="M 118 26 L 117.5 20"/>
      </g>
      <!-- middle band continues up into the dorsal fin -->
      <path d="M 97 6 C 95 24, 97 38, 102 48 L 82 48 C 81 36, 80 22, 79 6 Z" fill="#E4E8EA" stroke="#2A2745" stroke-width="1.8"/>
      <path d="M 125 29 C 123 20, 117 14, 109 13.5 Q 105 11.8, 102 14.5 Q 98.5 12.3, 95 15 Q 92 14, 89.5 18.5 C 87.5 13, 81 9.5, 72 9.5 C 61 9.5, 54 17, 50 31" fill="none" stroke="#2A2745" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M 125 29 C 123 20, 117 14, 109 13.5 Q 105 11.8, 102 14.5 Q 98.5 12.3, 95 15 Q 92 14, 89.5 18.5 C 87.5 13, 81 9.5, 72 9.5 C 61 9.5, 54 17, 50 31 L 54 40 L 126 34 Z" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- anal fin -->
    <path d="M 80 77 C 80 87, 74 93, 65 93 C 56 93, 50 86, 49 70 L 52 62 L 82 68 Z" fill="#E8731C"/>
    <g clip-path="url(#cf-clip-anal)">
      <path d="M 0 74 L 160 74 L 160 100 L 0 100 Z" fill="#3B2A6E" opacity="0.3"/>
      <g fill="none" stroke="#B5531C" stroke-width="1.4" stroke-linecap="round">
        <path d="M 58 74 L 56 86"/>
        <path d="M 65 77 L 64.5 90"/>
        <path d="M 73 78 L 73.5 88"/>
      </g>
      <path d="M 80 77 C 80 87, 74 93, 65 93 C 56 93, 50 86, 49 70" fill="none" stroke="#2A2745" stroke-width="5" stroke-linecap="round"/>
    </g>
    <path d="M 80 77 C 80 87, 74 93, 65 93 C 56 93, 50 86, 49 70 L 52 62 L 82 68 Z" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- pelvic fin -->
    <path d="M 126 76 C 125 84, 120 92, 112 93 C 107 93, 107 88, 110 84 C 112 81, 114 78, 114 73 Z" fill="#E8731C"/>
    <g clip-path="url(#cf-clip-pelvic)">
      <path d="M 0 74 L 160 74 L 160 100 L 0 100 Z" fill="#3B2A6E" opacity="0.3"/>
      <path d="M 126 76 C 125 84, 120 92, 112 93 C 107 93, 107 88, 110 84" fill="none" stroke="#2A2745" stroke-width="5" stroke-linecap="round"/>
    </g>
    <path d="M 126 76 C 125 84, 120 92, 112 93 C 107 93, 107 88, 110 84 C 112 81, 114 78, 114 73 Z" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- body -->
    <path d="M 154 54 C 154 40, 146 28, 128 25 C 105 19.5, 75 23.5, 58 33 C 49 37, 43 41, 37 43 L 37 62 C 44 66, 56 74, 72 78 C 92 83, 120 82, 138 74 C 148 69, 154 62, 154 54 Z" fill="#E8731C"/>
    <g clip-path="url(#cf-clip-body)">
      <!-- three soft-white bands with dark borders -->
      <path d="M 132 16 C 125 30, 124.5 52, 129 66 C 131 72, 133 78, 136 88 L 118 90 C 110 76, 108 60, 109.5 46 C 110.5 36, 113 26, 117 16 Z" fill="#E4E8EA" stroke="#2A2745" stroke-width="1.8"/>
      <path d="M 97 6 C 95 24, 97 38, 102 48 C 97 58, 95 70, 95 90 L 78 90 C 79 72, 81 58, 82 48 C 81 36, 80 22, 79 6 Z" fill="#E4E8EA" stroke="#2A2745" stroke-width="1.8"/>
      <path d="M 55 26 C 57 42, 58 56, 55 80 L 45 78 C 47 60, 47 46, 45 28 Z" fill="#E4E8EA" stroke="#2A2745" stroke-width="1.8"/>
      <!-- highlight along the back -->
      <path d="M 40 41 C 60 31, 95 21, 126 26 C 141 29, 150 38, 153 47 C 144 39, 133 34, 119 33 C 96 31, 66 36, 40 47 Z" fill="#E4E8EA" opacity="0.28"/>
      <!-- belly shadow -->
      <path d="M 30 58 C 60 64, 92 71, 120 69 C 135 68, 147 62, 160 52 L 160 100 L 30 100 Z" fill="#3B2A6E" opacity="0.3"/>
    </g>
    <path d="M 37 62 C 44 66, 56 74, 72 78 C 92 83, 120 82, 138 74 C 148 69, 154 62, 154 54 C 154 40, 146 28, 128 25 C 105 19.5, 75 23.5, 58 33 C 49 37, 43 41, 37 43" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- mouth -->
    <path d="M 153.6 58.6 L 148.6 59.8" fill="none" stroke="#2A2745" stroke-width="1.8" stroke-linecap="round"/>

    <!-- eye -->
    <circle cx="138.5" cy="43" r="7.8" fill="#E8B83A" stroke="#2A2745" stroke-width="2"/>
    <circle cx="139.2" cy="43.4" r="5.1" fill="#1A1830"/>
    <circle cx="137" cy="41" r="1.8" fill="#E4E8EA"/>
  </g>

  <!-- PECTORAL FIN: pivot at its base -->
  <g id="fin-pectoral" data-pivot="111 56">
    <path d="M 112 52 C 107 46, 99 43, 93 45.5 C 87.5 48, 86.5 58, 89.5 63 C 93 68, 103 66, 112 60 Z" fill="#E8731C" opacity="0.75"/>
    <g clip-path="url(#cf-clip-pect)">
      <path d="M 80 58 C 95 58, 105 58, 120 57 L 120 80 L 80 80 Z" fill="#3B2A6E" opacity="0.18"/>
      <g fill="none" stroke="#B5531C" stroke-width="1.2" stroke-linecap="round">
        <path d="M 108 52.5 L 95 46.5"/>
        <path d="M 108 54.5 L 90 51"/>
        <path d="M 108 56.5 L 89.5 57.5"/>
        <path d="M 108 58.5 L 92 63.5"/>
      </g>
    </g>
    <path d="M 112 52 C 107 46, 99 43, 93 45.5 C 87.5 48, 86.5 58, 89.5 63 C 93 68, 103 66, 112 60" fill="none" stroke="#2A2745" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
