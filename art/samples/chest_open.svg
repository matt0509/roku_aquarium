<svg xmlns="http://www.w3.org/2000/svg" width="230" height="250" viewBox="0 0 230 250">
  <!--
    Treasure chest, open. Same canvas, hinge and base as chest_closed.svg.
    Local frame origin = hinge; tilt = translate(18 131) rotate(4).
    The lid is the closed lid turned a further -28 degrees about the hinge.
    The treasure heap stays inside the closed lid's outline, so the closed
    lid hides it completely.
  -->
  <defs>
    <clipPath id="lidClip">
      <path d="M0 0 L0 -16 C0 -41.4 20.6 -62 46 -62 L156 -62 C181.4 -62 202 -41.4 202 -16 L202 0 Z"/>
    </clipPath>
    <clipPath id="baseClip">
      <rect x="3" y="0" width="196" height="98" rx="2"/>
    </clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="softSmall" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="rivet">
      <circle r="2.7" fill="#A87A1E"/>
      <circle cx="-0.8" cy="-0.9" r="1.1" fill="#EBD27A"/>
    </g>
    <path id="capBottom" d="M3 70 L15 70 L15 86 L31 86 L31 98 L3 98 Z"/>
    <path id="capTop" d="M0 -10 L0 -16 C0 -41.4 20.6 -62 46 -62 L50 -62 L50 -50 L46 -50 C27.2 -50 12 -34.8 12 -16 L12 -10 Z"/>

    <!-- coin shapes (unpainted, for the silhouette pass) -->
    <g id="coinFlatShape">
      <ellipse cy="1.8" rx="9" ry="5"/>
      <ellipse rx="9" ry="5"/>
    </g>
    <circle id="coinUpShape" r="8"/>
    <!-- painted coins -->
    <g id="coinFlat">
      <ellipse cy="1.8" rx="9" ry="5" fill="#A87A1E"/>
      <ellipse rx="9" ry="5" fill="#E0B23A" stroke="#A87A1E" stroke-width="1.2"/>
      <ellipse rx="5.4" ry="2.8" fill="none" stroke="#C4932A" stroke-width="1.2"/>
      <path d="M-6.4 -1.6 C-4.8 -3.6 -1.6 -4.3 1.4 -4.1" stroke="#EBD27A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="coinUp">
      <circle r="8" fill="#E0B23A" stroke="#A87A1E" stroke-width="1.4"/>
      <circle r="4.8" fill="none" stroke="#C4932A" stroke-width="1.2"/>
      <path d="M-5.6 -2.6 C-4.6 -5 -2.4 -6 0 -6.2" stroke="#EBD27A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <path id="sparkle" d="M0 -7 C0.9 -2 2 -0.9 7 0 C2 0.9 0.9 2 0 7 C-0.9 2 -2 0.9 -7 0 C-2 -0.9 -0.9 -2 0 -7 Z"/>
  </defs>

  <g id="base" data-pivot="115 238">
    <g transform="translate(18 131) rotate(4)">
      <!-- soft treasure glow (light gold, blurred, modest opacity) -->
      <ellipse cx="122" cy="-36" rx="54" ry="32" fill="#E0C672" opacity="0.42" filter="url(#soft)"/>
      <ellipse cx="126" cy="-26" rx="38" ry="18" fill="#E0C672" opacity="0.45" filter="url(#softSmall)"/>

      <!-- treasure heap: silhouette outline pass -->
      <g fill="#2A2745" stroke="#2A2745" stroke-width="6" stroke-linejoin="round">
        <path d="M6 2 C14 -14 34 -26 58 -32 C78 -38 94 -44 114 -45 C136 -46 158 -39 174 -26 C184 -17 192 -8 196 2 Z"/>
        <use href="#coinFlatShape" transform="translate(44 -29) rotate(-18)"/>
        <use href="#coinUpShape" transform="translate(70 -38)"/>
        <use href="#coinFlatShape" transform="translate(92 -44) rotate(-8)"/>
        <use href="#coinFlatShape" transform="translate(148 -42) rotate(14)"/>
        <use href="#coinUpShape" transform="translate(166 -33)"/>
        <use href="#coinFlatShape" transform="translate(184 -17) rotate(34)"/>
      </g>
      <!-- heap body -->
      <path d="M6 2 C14 -14 34 -26 58 -32 C78 -38 94 -44 114 -45 C136 -46 158 -39 174 -26 C184 -17 192 -8 196 2 Z" fill="#E0B23A"/>
      <path d="M40 -6 C70 -22 120 -30 186 -4 L196 2 L6 2 Z" fill="#C4932A"/>
      <path d="M30 -20 C50 -30 80 -38 112 -41" stroke="#EBD27A" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- coins resting in the heap -->
      <use href="#coinFlat" transform="translate(60 -20) rotate(-6)"/>
      <use href="#coinFlat" transform="translate(84 -28) rotate(8)"/>
      <use href="#coinFlat" transform="translate(110 -32)"/>
      <use href="#coinFlat" transform="translate(150 -24) rotate(-10)"/>
      <use href="#coinFlat" transform="translate(172 -12) rotate(16)"/>
      <use href="#coinFlat" transform="translate(98 -12) rotate(-4)"/>
      <use href="#coinFlat" transform="translate(130 -10) rotate(6)"/>
      <use href="#coinFlat" transform="translate(36 -10) rotate(-14)"/>
      <use href="#coinUp" transform="translate(122 -22) rotate(10)"/>
      <!-- coins on the heap's skyline -->
      <use href="#coinFlat" transform="translate(44 -29) rotate(-18)"/>
      <use href="#coinUp" transform="translate(70 -38)"/>
      <use href="#coinFlat" transform="translate(92 -44) rotate(-8)"/>
      <use href="#coinFlat" transform="translate(148 -42) rotate(14)"/>
      <use href="#coinUp" transform="translate(166 -33)"/>
      <use href="#coinFlat" transform="translate(184 -17) rotate(34)"/>

      <!-- gems -->
      <!-- ruby, classic cut -->
      <g transform="translate(124 -44) rotate(-6)">
        <path d="M-12 -2 L-7 -9 L7 -9 L12 -2 L0 11 Z" fill="#E0484D" stroke="#2A2745" stroke-width="2" stroke-linejoin="round"/>
        <path d="M-7 -9 L-4 -2 L-11 -2 Z" fill="#EB8285"/>
        <path d="M0 10 L4 -2 L11 -2 Z" fill="#A8304A"/>
        <path d="M-11 -2 H11 M-7 -9 L-4 -2 L0 -9 L4 -2 L7 -9 M-4 -2 L0 10 L4 -2" fill="none" stroke="#A8304A" stroke-width="1.2" stroke-linejoin="round"/>
      </g>
      <!-- sapphire, oval cabochon -->
      <g transform="translate(160 -22) rotate(12)">
        <ellipse rx="9" ry="7" fill="#2E7DE0" stroke="#2A2745" stroke-width="2"/>
        <ellipse cx="1" cy="1.5" rx="6" ry="4" fill="#2457B0"/>
        <ellipse cx="-2.5" cy="-2.5" rx="3.6" ry="2.2" fill="#7EB0EB"/>
      </g>
      <!-- emerald, step cut -->
      <g transform="translate(76 -22) rotate(-10)">
        <path d="M-8 -5 L-5 -8 H5 L8 -5 V5 L5 8 H-5 L-8 5 Z" fill="#4FA83D" stroke="#2A2745" stroke-width="2" stroke-linejoin="round"/>
        <rect x="-4" y="-4" width="8" height="8" fill="#7CC45A"/>
        <path d="M-8 5 L-5 8 H5 L8 5 V-5 L4 -4 V4 Z" fill="#2E7A3A"/>
      </g>

      <!-- inner lip of the front wall -->
      <rect x="3" y="-4" width="196" height="5" fill="#A5704A" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>

      <!-- wooden front: three planks -->
      <rect x="3" y="0" width="196" height="98" rx="2" fill="#8A5A3A"/>
      <g clip-path="url(#baseClip)">
        <rect x="3" y="3" width="196" height="4" fill="#A5704A"/>
        <rect x="3" y="34" width="196" height="4" fill="#A5704A"/>
        <rect x="3" y="67" width="196" height="3" fill="#9A6643"/>
        <rect x="3" y="26" width="196" height="6" fill="#66423A"/>
        <rect x="3" y="59" width="196" height="6" fill="#66423A"/>
        <rect x="3" y="70" width="196" height="28" fill="#66423A" opacity="0.45"/>
        <rect x="3" y="0" width="196" height="3" fill="#5A3826"/>
        <rect x="184" y="0" width="15" height="98" fill="#3A2A4A" opacity="0.28"/>
        <path d="M3 32.5 H199 M3 65.5 H199" stroke="#5A3826" stroke-width="2.5" fill="none"/>
        <g stroke="#6E472F" stroke-width="1.5" fill="none" stroke-linecap="round">
          <path d="M20 16 C26 13 32 18 40 14"/>
          <path d="M68 12 C74 9 79 13 84 10"/>
          <path d="M120 19 C126 16 131 20 136 17"/>
          <path d="M164 13 C170 10 175 14 180 11"/>
          <path d="M24 47 C30 44 34 49 42 46"/>
          <path d="M66 52 C74 49 80 54 84 51"/>
          <path d="M118 45 C124 42 130 46 137 43"/>
          <path d="M162 50 C168 47 173 51 178 48"/>
          <ellipse cx="126" cy="54" rx="4" ry="2.4"/>
          <ellipse cx="32" cy="22" rx="3.4" ry="2"/>
        </g>
      </g>
      <rect x="3" y="0" width="196" height="98" rx="2" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>

      <g stroke-linejoin="round">
        <rect x="46" y="0" width="16" height="98" fill="#E0B23A" stroke="#2A2745" stroke-width="3"/>
        <rect x="47.5" y="1.5" width="3" height="95" fill="#EBD27A"/>
        <rect x="57.5" y="1.5" width="3" height="95" fill="#A87A1E"/>
        <rect x="140" y="0" width="16" height="98" fill="#E0B23A" stroke="#2A2745" stroke-width="3"/>
        <rect x="141.5" y="1.5" width="3" height="95" fill="#EBD27A"/>
        <rect x="151.5" y="1.5" width="3" height="95" fill="#A87A1E"/>
      </g>
      <use href="#rivet" x="54" y="12"/>
      <use href="#rivet" x="54" y="48"/>
      <use href="#rivet" x="54" y="82"/>
      <use href="#rivet" x="148" y="12"/>
      <use href="#rivet" x="148" y="48"/>
      <use href="#rivet" x="148" y="82"/>

      <use href="#capBottom" fill="#E0B23A" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
      <use href="#capBottom" transform="translate(202 0) scale(-1 1)" fill="#E0B23A" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
      <path d="M5 72.5 H12.5 M17.5 88.5 H28.5" stroke="#EBD27A" stroke-width="2" stroke-linecap="round"/>
      <path d="M189.5 72.5 H197 M173.5 88.5 H184.5" stroke="#EBD27A" stroke-width="2" stroke-linecap="round"/>
      <use href="#rivet" x="9" y="92"/>
      <use href="#rivet" x="193" y="92"/>

      <path d="M86 3 H116 V30 C116 38 108 43 101 46 C94 43 86 38 86 30 Z" fill="#E0B23A" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
      <path d="M90.5 7.5 H111.5 V29 C111.5 35 106.5 38.5 101 41 C95.5 38.5 90.5 35 90.5 29 Z" fill="none" stroke="#A87A1E" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M88.5 7 V29" stroke="#EBD27A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="101" cy="26" r="4.2" fill="#2A2745"/>
      <path d="M98.6 28 L97.2 36.5 H104.8 L103.4 28 Z" fill="#2A2745" stroke="#2A2745" stroke-width="1" stroke-linejoin="round"/>
      <!-- lock staple, visible now the hasp has lifted -->
      <rect x="97.5" y="6" width="7" height="9" rx="3.5" fill="none" stroke="#2A2745" stroke-width="2.5"/>

      <!-- coins spilling over the front edge -->
      <use href="#coinFlat" transform="translate(126 2) rotate(-4)"/>
      <use href="#coinUp" transform="translate(176 5) rotate(-20)"/>

      <!-- sparkles -->
      <use href="#sparkle" transform="translate(117 -52) scale(1.2)" fill="#E4DAA4"/>
      <use href="#sparkle" transform="translate(172 -44) scale(0.8)" fill="#E4DAA4"/>
      <use href="#sparkle" transform="translate(150 -64)" fill="#E4DAA4" opacity="0.8"/>
    </g>
  </g>

  <g id="lid" data-pivot="18 131">
    <g transform="translate(18 131) rotate(4) rotate(-28)">
      <path d="M0 0 L0 -16 C0 -41.4 20.6 -62 46 -62 L156 -62 C181.4 -62 202 -41.4 202 -16 L202 0 Z" fill="#8A5A3A"/>
      <g clip-path="url(#lidClip)">
        <rect x="0" y="-62" width="202" height="17" fill="#A5704A"/>
        <rect x="0" y="-49" width="202" height="4" fill="#8A5A3A"/>
        <rect x="0" y="-44" width="202" height="3" fill="#A5704A"/>
        <rect x="0" y="-32" width="202" height="4" fill="#66423A"/>
        <rect x="0" y="-27" width="202" height="3" fill="#A5704A"/>
        <rect x="0" y="-16" width="202" height="5" fill="#66423A"/>
        <rect x="187" y="-62" width="15" height="62" fill="#3A2A4A" opacity="0.28"/>
        <path d="M0 -45 H202 M0 -28 H202" stroke="#5A3826" stroke-width="2.5" fill="none"/>
        <path d="M10 -36 C14 -50 26 -57 40 -58.5" stroke="#BE8A5E" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g stroke="#6E472F" stroke-width="1.5" fill="none" stroke-linecap="round">
          <path d="M70 -54 C76 -57 82 -53 88 -56"/>
          <path d="M116 -52 C122 -55 128 -51 134 -54"/>
          <path d="M20 -20 C26 -23 32 -19 38 -22"/>
          <path d="M72 -37 C78 -40 84 -36 90 -39"/>
          <path d="M164 -21 C170 -24 175 -20 180 -23"/>
          <path d="M116 -21 C121 -24 126 -20 131 -23"/>
        </g>
      </g>
      <path d="M0 0 L0 -16 C0 -41.4 20.6 -62 46 -62 L156 -62 C181.4 -62 202 -41.4 202 -16 L202 0 Z" fill="none" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>

      <rect x="0" y="-11" width="202" height="11" fill="#E0B23A" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
      <rect x="1.5" y="-9.5" width="199" height="2.5" fill="#EBD27A"/>
      <rect x="1.5" y="-3.5" width="199" height="2" fill="#A87A1E"/>

      <use href="#capTop" fill="#E0B23A" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
      <use href="#capTop" transform="translate(202 0) scale(-1 1)" fill="#E0B23A" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
      <path d="M4 -18 C4 -37 18 -55 40 -57.5" stroke="#EBD27A" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M198 -18 C198 -34 188 -48 176 -54" stroke="#A87A1E" stroke-width="2" fill="none" stroke-linecap="round"/>

      <g stroke-linejoin="round">
        <rect x="46" y="-62" width="16" height="51" fill="#E0B23A" stroke="#2A2745" stroke-width="3"/>
        <rect x="47.5" y="-60.5" width="3" height="48" fill="#EBD27A"/>
        <rect x="57.5" y="-60.5" width="3" height="48" fill="#A87A1E"/>
        <rect x="140" y="-62" width="16" height="51" fill="#E0B23A" stroke="#2A2745" stroke-width="3"/>
        <rect x="141.5" y="-60.5" width="3" height="48" fill="#EBD27A"/>
        <rect x="151.5" y="-60.5" width="3" height="48" fill="#A87A1E"/>
      </g>
      <use href="#rivet" x="54" y="-50"/>
      <use href="#rivet" x="54" y="-25"/>
      <use href="#rivet" x="148" y="-50"/>
      <use href="#rivet" x="148" y="-25"/>
      <use href="#rivet" x="22" y="-5.5"/>
      <use href="#rivet" x="78" y="-5.5"/>
      <use href="#rivet" x="124" y="-5.5"/>
      <use href="#rivet" x="180" y="-5.5"/>

      <path d="M93 -14 H109 V10 C109 15 105.5 18 101 18 C96.5 18 93 15 93 10 Z" fill="#E0B23A" stroke="#2A2745" stroke-width="3" stroke-linejoin="round"/>
      <path d="M95.5 -11 V9" stroke="#EBD27A" stroke-width="2" stroke-linecap="round"/>
      <rect x="98" y="4" width="6" height="8" rx="3" fill="#A87A1E"/>

      <circle cx="0" cy="0" r="5.5" fill="#E0B23A" stroke="#2A2745" stroke-width="3"/>
      <circle cx="0" cy="0" r="1.8" fill="#A87A1E"/>
    </g>
  </g>
</svg>
